services:
  postgres:
    image: postgres:16-alpine
    container_name: torqueworks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: torqueworks
      POSTGRES_PASSWORD: torqueworks
      POSTGRES_DB: torqueworks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torqueworks -d torqueworks"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torqueworks-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
